name: AI Equity Research V2 Tests

on:
  push:
    branches:
      - feature/advanced-equity-intelligence
      - recovery/ai-equity-research-2026-11-28
    paths:
      - "Projects/ai-equity-research-v2/**"
      - ".github/workflows/ai-equity-research-v2-tests.yml"
  pull_request:
    paths:
      - "Projects/ai-equity-research-v2/**"
      - ".github/workflows/ai-equity-research-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-equity-research-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equity_test
          POSTGRES_PASSWORD: equity_test_only
          POSTGRES_DB: equity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equity_test -d equity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_EQUITY_RESEARCH_TEST_DATABASE_URL: postgresql://equity_test:equity_test_only@localhost:5432/equity_test
      AI_EQUITY_RESEARCH_ALLOW_SCHEMA_INIT: "YES"
    defaults:
      run:
        working-directory: Projects/ai-equity-research-v2
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Projects/ai-equity-research-v2/requirements.txt
      - name: Install PostgreSQL client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -F ' 16.'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q . -x "\\.venv|equity-research-lab-main"
      - name: Run complete automated and PostgreSQL integration test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q -p no:cacheprovider
