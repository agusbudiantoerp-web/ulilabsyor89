name: AI Equity Research V2 Tests

on:
  push:
    branches:
      - feature/advanced-equity-intelligence
    paths:
      - "Projects/ai-equity-research-v2/**"
      - ".github/workflows/ai-equity-research-v2-tests.yml"
  pull_request:
    paths:
      - "Projects/ai-equity-research-v2/**"
      - ".github/workflows/ai-equity-research-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equity_test
          POSTGRES_PASSWORD: equity_test_only
          POSTGRES_DB: equity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equity_test -d equity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_EQUITY_RESEARCH_TEST_DATABASE_URL: postgresql://equity_test:equity_test_only@localhost:5432/equity_test
    defaults:
      run:
        working-directory: Projects/ai-equity-research-v2
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Projects/ai-equity-research-v2/requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q . -x "\\.venv|equity-research-lab-main"
      - name: Run complete automated and PostgreSQL integration test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q -p no:cacheprovider
