version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/Projects/ai-equity-research-v2"
    target-branch: "feature/advanced-equity-intelligence"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature/advanced-equity-intelligence"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
